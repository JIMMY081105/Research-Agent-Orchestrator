<section class="prompt-page" data-view="prompt">
  <div class="conversation" id="conversation">
    <div class="welcome"><div class="welcome-orbit" aria-hidden="true"><span></span><i></i></div><h1>今天，想推进什么？</h1><p>一个问题，一个计划，或下一个研究目标。</p><div class="starter-row"><button type="button" data-starter="帮我比较两个场景生成方案。">◇ 比较方案</button><button type="button" data-starter="先帮我制定一份可审核的研究计划。">≡ 制定计划</button><button type="button" data-starter="梳理这个目标需要哪些资产和验证证据。">↗ 梳理目标</button></div></div>
    <div id="messages" class="messages"></div>
  </div>
  <form id="prompt-form" class="composer" hx-post="/demo/message" hx-target="#messages" hx-swap="beforeend">
    <div class="composer-top"><label class="channel"><span class="sr-only">工作类型</span><select name="channel" data-draft><option value="codex">Codex 工作</option><option value="analysis">文本分析</option></select></label><span class="composer-caption">仅 UI 预览 · 发送不会运行任务</span></div>
    <details class="references"><summary>＋ 引用材料与附件</summary><textarea name="references" data-draft rows="2" placeholder="粘贴引用文本，先预览材料区域的布局…" aria-label="引用材料"></textarea><span>附件上传尚未连接；此处仅展示引用文本输入。</span></details>
    <label class="sr-only" for="prompt">输入任务或问题</label><textarea id="prompt" name="prompt" data-draft maxlength="20000" placeholder="给 Codex 一项任务，或一起制定计划…" rows="3" required></textarea>
    <div class="composer-bottom"><div class="settings-row">{% include 'partials/settings.html' %}</div><button class="send" type="submit" aria-label="发送预览消息">↑</button></div>
    <div class="composer-note"><span>⇧ Enter 换行</span></div>
  </form>
  <footer class="prompt-footnote">Flask · Jinja2 · HTMX <span>你的布局，先于自动化。</span></footer>
</section>
