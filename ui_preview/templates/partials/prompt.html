<section class="prompt-page" data-view="prompt">
  <div class="conversation" id="conversation">
    <div class="welcome"><div class="welcome-orbit" aria-hidden="true"><span></span><i></i></div><h1>今天，想推进什么？</h1><p>一个问题，一个计划，或下一个研究目标。</p><div class="starter-row"><button type="button" data-starter="帮我比较两个场景生成方案。">◇ 比较方案</button><button type="button" data-starter="先帮我制定一份可审核的研究计划。">≡ 制定计划</button><button type="button" data-starter="梳理这个目标需要哪些资产和验证证据。">↗ 梳理目标</button></div></div>
    <div id="messages" class="messages"></div>
  </div>
  <form id="prompt-form" class="composer" hx-post="/execute" hx-target="#messages" hx-swap="innerHTML">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="request_id" value="{{ request_id }}"><input type="hidden" name="session" value="{{ current_session }}">
    <div class="composer-top"><label class="channel"><span class="sr-only">工作类型</span><select name="channel" data-draft><option value="codex">Codex 工作</option><option value="analysis">文本分析</option></select></label><span class="composer-caption">{{ 'Codex → Claude → 最多两次自动修复' if connected else '执行服务未就绪' }}</span></div>
    <details class="references"><summary>＋ 引用材料</summary><textarea name="references" data-draft rows="2" placeholder="粘贴本轮相关文字；大项目使用已登记的绝对路径与资料索引。" aria-label="引用材料"></textarea></details>
    <label class="sr-only" for="prompt">输入任务或问题</label><textarea id="prompt" name="prompt" data-draft maxlength="20000" placeholder="给 Codex 一项任务，或一起制定计划…" rows="3" required></textarea>
    <div class="composer-bottom"><div class="settings-row">{% include 'partials/settings.html' %}</div><button class="send" type="submit" aria-label="提交真实任务"{% if not connected %} disabled{% endif %}>↑</button></div>
    <div class="composer-note"><span>⇧ Enter 换行</span></div>
  </form>
  <footer class="prompt-footnote">Flask · Jinja2 · HTMX <span>你的布局，先于自动化。</span></footer>
</section>
