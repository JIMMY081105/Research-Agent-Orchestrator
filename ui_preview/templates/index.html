<!doctype html>
<html lang="zh-CN" data-page="{{ page }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Scene Control · UI Preview</title>
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"historyCacheSize":0,"includeIndicatorStyles":false}'>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
<script src="{{ url_for('static',filename='vendor/htmx.min.js') }}" defer></script>
<script src="{{ url_for('static',filename='ui.js') }}" defer></script>
</head><body>
<aside class="sidebar">
  <a href="/" class="brand"><span class="brand-icon">S</span><span>Scene Control<small>RESEARCH WORKSPACE</small></span></a>
  <button class="nav new-chat" id="new-chat" hx-get="/view/prompt" hx-target="#workspace"><span class="nav-icon">＋</span><span>新对话</span></button>
  <a class="nav" data-nav="prompt" href="/?page=prompt" hx-get="/view/prompt" hx-target="#workspace"><span class="nav-icon">◧</span><span>Prompt</span></a>
  <a class="nav" data-nav="progress" href="/?page=progress" hx-get="/view/progress" hx-target="#workspace"><span class="nav-icon">≋</span><span>Progress</span></a>
  <div class="side-label">YOUR WORKSPACE</div>
  <p class="side-copy">从一个问题开始。<br>把计划变成可见的进展。</p>
  <div class="side-spacer"></div>
  <div class="side-footer"><span class="preview-dot"></span> UI PREVIEW<small>仅预览排版与交互<br>未接入模型、GPU 或任务系统</small><button id="motion-toggle" aria-pressed="false">◌ 动效开启</button></div>
</aside>
<div class="app">
  <header class="topbar">
    <details class="page-switch" id="page-switch"><summary><span id="page-name">{{ page|capitalize }}</span><span class="chevron">⌄</span></summary>
      <nav class="page-menu" aria-label="切换页面"><a href="/?page=prompt" hx-get="/view/prompt" hx-target="#workspace">Prompt<small>输入问题，选择工作方式</small></a><a href="/?page=progress" hx-get="/view/progress" hx-target="#workspace">Progress<small>执行阶段与审核的视觉预览</small></a></nav>
    </details>
    <div class="gpu-chip" aria-label="示例 GPU 读数，仅用于排版"><span class="gpu-icon">▦</span><span>SQZ GPU</span><b>42<small>%</small></b><span class="gpu-detail">12.8<small> GiB</small></span><span class="gpu-detail">51<small>°C</small></span><em>DEMO</em></div>
    <span class="preview-badge">UI PREVIEW</span>
  </header>
  <main id="workspace" class="workspace" aria-live="polite">{% include 'partials/'+page+'.html' %}</main>
</div>
</body></html>
